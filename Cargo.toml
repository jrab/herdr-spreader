[package]
name = "herdr-spreader"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Apply tmuxinator-style project layouts to herdr from a YAML file"
repository = "https://github.com/yuk1ty/herdr-spreader"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
